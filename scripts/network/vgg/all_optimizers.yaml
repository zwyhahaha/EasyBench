program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_vgg_all_optimizers
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    value: 128
  epochs:
    value: 50
  stop_step:
    value: 100
  task:
    value: 'network'
  model:
    value: 'vgg'
  dataset:
    value: 'CIFAR10'
  optimizer:
    values: ['OSMM2',]
  learning_rate:
    values: [0.01]
  beta:
    values: [0.0]
  beta_lr:
    values: [1,0.1]
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  weight_decay:
    value: 1e-4
  seed:
    values: [0,1,2]