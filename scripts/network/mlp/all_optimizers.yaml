program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_mlp_all_optimizers
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    value: 128
  epochs:
    value: 50
  stop_step:
    value: 100
  task:
    value: 'network'
  model:
    value: 'mlp'
  dataset:
    value: 'MNIST'
  optimizer:
    values: ['SGD', 'NAG', 'Adam']
  learning_rate:
    values: [0.1,0.01,0.001]
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  weight_decay:
    value: 1e-4
  seed:
    values: [0,1,2]