program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_mlp_mnist_osmm_tune
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    value: 128
  epochs:
    value: 50
  stop_step:
    value: 100
  task:
    value: 'network'
  model:
    value: 'mlp'
  dataset:
    value: 'MNIST'
  optimizer:
    values: ['OSMM','OSMM2']
  learning_rate:
    values: [0.1,0.01,0.001]
  relax_coef:
    value: 1.5
  beta:
    values: [0.9]
  beta_lr:
    values: [0.1,1.0]
  gr_eps:
    value: 1e-8
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  weight_decay:
    value: 1e-4
  dampening:
    values: [0.0]
  adagrad:
    values: [True]
  seed:
    values: [0,1,2]