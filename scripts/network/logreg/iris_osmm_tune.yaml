program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_iris_osmm_tune_larger_lr
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    values: [16,64,128]
  epochs:
    value: 50
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    value: 'LIBSVM_iris'
  optimizer:
    value: 'OSMM'
  learning_rate:
    values: [1]
  relax_coef:
    values: [1.0, 1.5, 2.5]
  beta:
    value: 0.9
  beta_lr:
    values: [0.01, 0.001]
  gr_eps:
    values: [1e-5, 1e-8, 1e-20]
  scheduler:
    value: None
  lr_decay:
    value: 1.0