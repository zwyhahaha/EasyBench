program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_letter_all_optimizers
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    values: [64]
  epochs:
    value: 10
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    value: 'LIBSVM_letter'
  optimizer:
    values: ['NAG', 'Adam', 'SGD']
  learning_rate:
    values: [1.0,10.0]
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  weight_decay:
    value: 0.0
  seed:
    values: [0,1,2]