program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_mnist_osmm_dampening
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    value: 128
  epochs:
    value: 10
  stop_step:
    value: 20
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    value: 'LIBSVM_mnist' # MNIST
  optimizer:
    value: 'OSMM'
  learning_rate:
    values: [0.01]
  relax_coef:
    value: 1.5
  beta:
    value: 0.9
  beta_lr:
    values: [1]
  gr_eps:
    value: 1e-8
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  seed:
    values: [0,1,2]
  weight_decay:
    values: [0.0, 1e-4]
  dampening:
    values: [0, 0.1, 0.3, 0.5, 0.9]
  