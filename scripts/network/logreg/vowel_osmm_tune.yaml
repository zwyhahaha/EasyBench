program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_vowel_osmm_dampening
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    value: 4
  epochs:
    value: 50
  stop_step:
    value: 100
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    value: 'LIBSVM_vowel'
  optimizer:
    value: 'OSMM'
  learning_rate:
    values: [0.01]
  relax_coef:
    value: 1.5
  beta:
    value: 0.9
  beta_lr:
    values: [1.0]
  gr_eps:
    value: 1e-8
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  weight_decay:
    value: 0.0
  dampening:
    values: [0.0,0.1,0.3,0.5,0.9]
  seed:
    values: [0,1,2]