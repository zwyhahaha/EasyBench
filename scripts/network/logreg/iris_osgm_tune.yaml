program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_iris_osgm_tune_larger_lr
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    values: [16, 64, 128]
  epochs:
    value: 50
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    value: 'LIBSVM_iris'
  optimizer:
    value: 'OSGM'
  learning_rate:
    values: [0.1,1.0,10.0]
  relax_coef:
    values: [1.0, 1.5, 2.5]
  gr_eps:
    values: [1e-5, 1e-8, 1e-20]
  scheduler:
    value: None
  lr_decay:
    value: 1.0