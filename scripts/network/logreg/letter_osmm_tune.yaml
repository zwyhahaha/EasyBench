program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_letter_osmm_tune
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    values: [16,64,128]
  epochs:
    value: 10
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    value: 'LIBSVM_letter'
  optimizer:
    value: 'OSMM'
  learning_rate:
    value: 0.1
  relax_coef:
    values: [1.5, 2.5]
  beta:
    value: 0.9
  beta_lr:
    value: 0.1
  gr_eps:
    values: [1e-5, 1e-8, 1e-20]
  scheduler:
    value: None
  lr_decay:
    value: 1.0