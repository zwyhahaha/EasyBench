program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_middle_all_optimizers
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    values: [16]
  epochs:
    value: 40
  stop_step:
    value: 100
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    values: ['LIBSVM_satimage','LIBSVM_segment']
  optimizer:
    values: ['NAG', 'Adam', 'SGD', 'OSMM']
  learning_rate:
    values: [0.01,0.1,1.0]
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  weight_decay:
    value: 0.0
  seed:
    values: [0,1,2]