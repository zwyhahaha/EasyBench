program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_middle_osmm_overparam
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    values: [16]
  epochs:
    value: 20
  stop_step:
    value: 100
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    values: ['LIBSVM_segment']
  optimizer:
    values: ['OSMM2']
  learning_rate:
    values: [1.0]
  relax_coef:
    value: 1.5
  beta:
    values: [0.9]
  beta_lr:
    values: [0.1]
  gr_eps:
    value: 1e-8
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  weight_decay:
    value: 1e-4
  dampening:
    values: [0.0]
  adagrad:
    values: [False]
  seed:
    values: [0,1,2]
  overparam:
    value: True
  target_samples:
    value: 2000