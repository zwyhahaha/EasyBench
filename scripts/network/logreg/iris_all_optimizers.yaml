program: sweep.py
method: grid  # available methods: grid, random, bayes
project: network_logreg_iris_all_optimizers
metric:
  name: train_loss
  goal: minimize
parameters:
  batch_size:
    values: [16,64,128]
  epochs:
    value: 50
  task:
    value: 'network'
  model:
    value: 'logreg'
  dataset:
    value: 'LIBSVM_iris'
  optimizer:
    values: ['NAG', 'Adam', 'OSGM', 'SGD', 'OSMM']
  learning_rate:
    values: [1.0,10.0]
  scheduler:
    value: None
  lr_decay:
    value: 1.0