program: sweep.py
method: grid  # available methods: grid, random, bayes
project: gpt_all_optimizers
metric:
  name: train_loss
  goal: minimize
parameters:
  epochs:
    value: 50
  stop_step:
    value: 100
  task:
    value: 'gpt'
  model:
    value: 'gpt'
  dataset:
    value: None
  optimizer:
    values: ['AdamW'] # 'OSMM2','OSMM', 'Adam', 'SGD', 'NAG'
  learning_rate:
    values: [0.001,]
  beta:
    values: [0.0]
  beta_lr:
    values: [0.1]
  scheduler:
    value: None
  lr_decay:
    value: 1.0
  weight_decay:
    value: 1e-1
  seed:
    values: [0,1,2]